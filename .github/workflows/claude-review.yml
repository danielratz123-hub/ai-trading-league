# Claude reviews every PR automatically: when it opens and after every new push.
# The fix loop: review -> builder pushes fixes -> review again.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Skip drafts, PRs from forks (strangers on a public repo) and Agent Hub
    # PRs (hub/ branches): there, the reviewer Joe picked reviews (HUB.md).
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.event.pull_request.head.ref, 'hub/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BRANCH: ${{ github.event.pull_request.head.ref }}

            You are the reviewer. Review this PR against AGENTS.md, especially the
            "Hard rules" and "Code Review Rules" sections, and the linked issue's
            "Done when". Read earlier review comments on this PR first: check whether
            your previous Must-fix points were fixed, and don't repeat fixed ones.

            Post inline comments on specific lines, then ONE summary comment with
            `gh pr comment`, written in plain, simple English (Joe reads it on his phone):

            **Verdict:** ✅ Ready to merge  /  🔧 Needs fixes  /  ⛔ Stop, Joe must look
            **Must fix:** numbered list (or "none")
            **Should fix:** short list (or "none")
            **After merging, Joe must:** anything to do on the VPS (or "nothing")

            If the verdict is "Needs fixes", end the summary with one line for the builder:
            - branch starts with `codex/`  -> `@codex please fix the Must-fix points above`
            - branch starts with `gemini/` -> `@gemini-cli please fix the Must-fix points above`
            - otherwise leave it for Joe.
            If this is already your 4th review on this PR and it still needs fixes,
            use "⛔ Stop, Joe must look" instead and don't ping a builder.

            Use ⛔ for anything touching secrets, deploy, risk limits or real orders.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Read,Grep,Glob"
