<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Admin · ds</title>
<link rel="stylesheet" href="/admin/static/admin.css">
<script src="/admin/static/admin.js" defer></script>
<script src="/admin/static/database.js" defer></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="/admin/" aria-label="ds admin">
    <span class="mono">ds</span><span class="brand-name">Admin</span>
  </a>
  <nav class="nav" aria-label="Sections">
    <a href="#status" data-tab="status" aria-current="page">Status</a>
    <a href="#database" data-tab="database">Database</a>
  </nav>
  <button id="theme" class="icon" type="button" aria-label="Switch light or dark">◐</button>
</header>
<main>
  <section id="status" class="tab">
    <h1>Status</h1>
    <div class="card">
      <p class="label">Admin service</p>
      <p class="big" id="ping">Checking…</p>
    </div>
    <p class="muted">Read-only. Nothing here can change the league.</p>
  </section>
  <section id="database" class="tab" hidden>
    <h1>Database</h1>
    <div class="card db-card">
      <p class="label">Shortcuts</p>
      <div id="db-shortcuts" class="chip-row" aria-label="Shortcut tables"></div>
      <p class="label db-section-label">All tables</p>
      <div id="db-tables" class="table-grid" aria-label="All database tables">
        <p class="muted">Loading tables…</p>
      </div>
    </div>
    <div id="db-browser" class="card db-card" hidden>
      <div class="db-toolbar">
        <div class="db-title-group">
          <h2 id="db-table-title" class="db-title"></h2>
          <span id="db-table-total" class="muted"></span>
        </div>
        <div class="db-controls">
          <input id="db-search" class="db-input" type="search" placeholder="Search text columns…" aria-label="Search table">
          <a id="db-export" class="btn btn-orange" href="/admin/api/tables/trades/export.csv" download="export.csv">Export CSV</a>
        </div>
      </div>
      <p id="db-status" class="muted" hidden></p>
      <div class="table-scroll">
        <table class="db-table" id="db-grid">
          <thead id="db-thead"></thead>
          <tbody id="db-tbody"></tbody>
        </table>
      </div>
      <div class="db-pager">
        <button id="db-prev" class="btn" type="button" disabled>Previous</button>
        <span id="db-page-info" class="muted">page 1 of 1</span>
        <button id="db-next" class="btn" type="button" disabled>Next</button>
      </div>
    </div>
    <div id="db-modal-backdrop" class="modal-backdrop" hidden>
      <div class="modal-panel card" role="dialog" aria-modal="true" aria-labelledby="db-record-title">
        <div class="modal-header">
          <h2 id="db-record-title" class="db-title">Record</h2>
          <button id="db-modal-close" class="btn" type="button" aria-label="Close record">Close</button>
        </div>
        <div id="db-record-body" class="record-body"></div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
