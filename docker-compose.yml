# AI Trading League on a VPS. See DEPLOY.md.
#   docker compose up -d --build     start everything
#   docker compose ps                status + health
#   docker compose logs -f engine    follow the scheduler
#
# caddy   = HTTPS for your domain; the ONLY service reachable from outside
# api     = dashboard + API, behind the login; internal network only
# engine  = the scheduler: decide / execute / daily / backups / alerts
# setup   = the setup page, on the server's own 127.0.0.1:8000 only
#           (open it through an SSH tunnel, see DEPLOY.md)
# All share the arena-data volume (the database). The CLI logins live in
# their own volumes so a rebuild never signs the agents out.

x-common: &common
  build:
    context: .
    args:
      APP_UID: ${APP_UID:-1000}        # your user id on the server (id -u); set in .env
  image: ai-trading-league:latest
  env_file: .env
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}    # don't fill the disk with logs

x-server-env: &server-env
  ARENA_SERVER: "1"                    # login + ADMIN_TOKEN required, see arena/api/auth.py
  # Codex's own Linux sandbox (bubblewrap) can't start inside a Docker
  # container: it was tested on Ubuntu 24.04 and fails even with seccomp and
  # AppArmor both off; only --privileged would work, which would weaken the
  # whole container. Codex's shell, patch and file tools are switched off by
  # arena/agents/cli.py anyway, and the container (non-root, no capabilities,
  # no-new-privileges) is the boundary. See DEPLOY.md.
  CODEX_SANDBOX: danger-full-access

services:
  caddy:
    image: caddy:2.10.2
    env_file: .env                     # for DOMAIN
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data               # certificates
      - caddy-config:/config
    depends_on: [api]
    restart: unless-stopped
    networks: [web]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  api:
    <<: *common
    command: ["python", "-m", "arena.main", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *server-env
      ARENA_DISABLE_CONTROL: "1"       # no setup page on the public side
    volumes:
      - arena-data:/app/data
    # No `ports:`: only Caddy (same "web" network) can reach it. "default"
    # gives it internet access for live prices.
    networks: [web, default]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=10)"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  engine:
    <<: *common
    command: ["python", "-m", "arena.main", "scheduler"]
    environment:
      <<: *server-env
    volumes:
      - arena-data:/app/data
      - claude-home:/home/arena/.claude
      - codex-home:/home/arena/.codex
      - rclone-config:/home/arena/.config/rclone   # Google Drive sign-in for backups
    # docker stop sends SIGTERM; the scheduler finishes its current job
    # first. Agent turns can take long; they re-run safely after a kill.
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-m", "arena.main", "health", "--scheduler"]
      interval: 60s
      timeout: 20s
      start_period: 60s
      retries: 3

  setup:
    <<: *common
    # The server's own network, listening on 127.0.0.1 only: unreachable
    # from the internet even without a firewall. The setup page checks that
    # requests come from 127.0.0.1, which only an SSH tunnel can provide.
    network_mode: host
    command: ["python", "-m", "arena.main", "serve", "--host", "127.0.0.1", "--port", "8000"]
    environment:
      <<: *server-env
      AUTOSTART_SCHEDULER: "0"         # the engine service runs the scheduler
      ARENA_LIVE: "0"                  # Alpaca allows ONE stream connection: the api service has it
    volumes:
      - arena-data:/app/data
      - claude-home:/home/arena/.claude
      - codex-home:/home/arena/.codex
      - rclone-config:/home/arena/.config/rclone
      - ./.env:/app/.env               # so the setup page can save settings (then: docker compose up -d)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=10)"]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3

  # Agent Hub: hands coding tasks to Claude / Codex / Gemini on your
  # subscriptions and opens PRs (see HUB.md). OFF unless .env has
  # COMPOSE_PROFILES=hub. Its own image, volumes and hub.env: it never sees the
  # league's database, .env or CLI logins, and the league's health check and
  # rollback ignore it.
  hub:
    profiles: ["hub"]
    build:
      context: .
      dockerfile: Dockerfile.hub
      args:
        APP_UID: ${APP_UID:-1000}
    image: ai-trading-league-hub:latest
    env_file:
      - path: hub.env
        required: false
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes:
      - hub-data:/hub/data
      - hub-claude:/home/hub/.claude
      - hub-codex:/home/hub/.codex
      - hub-gemini:/home/hub/.gemini
    networks: [web, default]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/hub/healthz', timeout=10)"]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3

networks:
  web:

volumes:
  rclone-config:
  arena-data:
  claude-home:
  codex-home:
  caddy-data:
  caddy-config:
  hub-data:
  hub-claude:
  hub-codex:
  hub-gemini:
